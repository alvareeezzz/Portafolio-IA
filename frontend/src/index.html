<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tu Nombre · Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Tu Nombre Apellido: experiencia, formación y proyectos.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplica el tema guardado antes de pintar, para que no parpadee al recargar (ver ThemeService) -->
  <script>
    try {
      var tema = localStorage.getItem('tema');
      if (tema) document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
